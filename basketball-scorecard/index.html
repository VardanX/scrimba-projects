<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./index.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />
    <title>Basketball Scorecard</title>
  </head>
  <body>
    <div class="scoreboard">
      <div class="home">
        <h3>HOME</h3>
        <div class="scorecard">
          <p class="score" id="home-scorecard">0</p>
        </div>
        <div class="points">
          <button class="point" id="home-one">+1</button>
          <button class="point" id="home-two">+2</button>
          <button class="point" id="home-three">+3</button>
        </div>
      </div>

      <div class="guest">
        <h3>GUEST</h3>
        <div class="scorecard">
          <p class="score" id="away-scorecard">0</p>
        </div>
        <div class="points">
          <button class="point" id="away-one">+1</button>
          <button class="point" id="away-two">+2</button>
          <button class="point" id="away-three">+3</button>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
